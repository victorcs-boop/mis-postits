<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Post-its</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fbc02d">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #202124;
      color: #fff;
      padding: 16px;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.3rem; font-weight: 500; }
    button.btn-nuevo {
      background: #fbc02d;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .postit {
      height: 220px;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      transition: transform 0.1s;
    }
    .postit:focus-within { transform: scale(1.02); }
    .postit-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .postit-actions button {
      background: rgba(0, 0, 0, 0.1);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-left: 4px;
    }
    .postit textarea {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      resize: none;
      outline: none;
      font-size: 0.95rem;
      font-family: inherit;
      color: #202124;
    }
    /* Estilos para la ventana flotante (Picture-in-Picture) */
    body.pip-mode {
      background: transparent;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }
    body.pip-mode .postit {
      height: 100vh;
      border-radius: 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📌 Mis Post-its</h1>
    <button class="btn-nuevo" onclick="crearNota()">+ Nueva Nota</button>
  </header>

  <div class="grid" id="contenedor-notas"></div>

  <script>
    // Registro de Service Worker para PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    const COLORES = ['#fff59d', '#ffcc80', '#c8e6c9', '#b3e5fc', '#f8bbd0'];
    let notas = JSON.parse(localStorage.getItem('chromebook_postits') || '[]');

    function guardar() {
      localStorage.setItem('chromebook_postits', JSON.stringify(notas));
    }

    function crearNota(texto = '', color = null) {
      const nota = {
        id: Date.now(),
        texto: texto,
        color: color || COLORES[Math.floor(Math.random() * COLORES.length)]
      };
      notas.unshift(nota);
      guardar();
      renderizar();
    }

    function eliminarNota(id) {
      notas = notas.filter(n => n.id !== id);
      guardar();
      renderizar();
    }

    function actualizarTexto(id, nuevoTexto) {
      const nota = notas.find(n => n.id === id);
      if (nota) {
        nota.texto = nuevoTexto;
        guardar();
      }
    }

    // Función para desanclar un post-it y dejarlo flotando sobre todo el sistema
    async function flotarNota(id) {
      if (!('documentPictureInPicture' in window)) {
        alert('Tu navegador aún no soporta Picture-in-Picture avanzado. Asegúrate de tener ChromeOS actualizado.');
        return;
      }

      const nota = notas.find(n => n.id === id);
      if (!nota) return;

      // Abrir ventana flotante
      const pipWindow = await window.documentPictureInPicture.requestWindow({
        width: 260,
        height: 260,
      });

      // Copiar estilos a la ventana flotante
      [...document.styleSheets].forEach((sheet) => {
        try {
          const cssRules = [...sheet.cssRules].map(r => r.cssText).join('');
          const style = document.createElement('style');
          style.textContent = cssRules;
          pipWindow.document.head.appendChild(style);
        } catch (e) {}
      });

      pipWindow.document.body.classList.add('pip-mode');
      pipWindow.document.body.innerHTML = `
        <div class="postit" style="background-color: ${nota.color};">
          <textarea placeholder="Escribe aquí...">${nota.texto}</textarea>
        </div>
      `;

      // Escuchar cambios en la ventana flotante y guardarlos
      const textarea = pipWindow.document.querySelector('textarea');
      textarea.focus();
      textarea.addEventListener('input', (e) => {
        actualizarTexto(id, e.target.value);
        // Sincronizar con la ventana original si está abierta
        const el = document.querySelector(`[data-id="${id}"] textarea`);
        if (el) el.value = e.target.value;
      });
    }

    function renderizar() {
      const contenedor = document.getElementById('contenedor-notas');
      contenedor.innerHTML = '';

      notas.forEach(nota => {
        const div = document.createElement('div');
        div.className = 'postit';
        div.dataset.id = nota.id;
        div.style.backgroundColor = nota.color;

        div.innerHTML = `
          <div class="postit-header">
            <span></span>
            <div class="postit-actions">
              <button title="Flotar sobre otras ventanas" onclick="flotarNota(${nota.id})">📌</button>
              <button title="Eliminar" onclick="eliminarNota(${nota.id})">✕</button>
            </div>
          </div>
          <textarea placeholder="Escribe aquí...">${nota.texto}</textarea>
        `;

        div.querySelector('textarea').addEventListener('input', (e) => {
          actualizarTexto(nota.id, e.target.value);
        });

        contenedor.appendChild(div);
      });
    }

    // Inicializar con una nota de bienvenida si está vacío
    if (notas.length === 0) {
      crearNota('¡Bienvenido! Haz clic en 📌 para hacerme flotar siempre visible por encima de cualquier app o navegador.');
    } else {
      renderizar();
    }
  </script>
</body>
</html>
